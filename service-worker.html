<!doctype html><html><head><meta charset="utf-8"><title>Service worker isolation</title></head><body><p id="status">service-worker-pending</p><script>navigator.serviceWorker.register('./sw.js').then(()=>document.getElementById('status').textContent='service-worker-registered').catch(()=>document.getElementById('status').textContent='service-worker-blocked');</script></body></html>
